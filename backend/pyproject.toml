[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-ai>=2.5,<3",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
]

# テスト用の依存。`uv pip install -e ".[dev]"` で入る
# pytest-asyncio は tests/test_tools.py・tests/test_chat_agent.py の
# `@pytest.mark.asyncio` に要る(既定の strict モードで動くため設定は持たない)
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# DGX Spark 上のサービス定義(design.md §3.2.2)。
# 本ファイルが定義するのは vllm のみ。backend は公開 VM 側に置くため
# ここでは定義しない(§3.2.1)。起動は `docker compose up -d vllm`。

# **プロジェクト名をサービス名 Syllabel で固定する。** 省略するとクローン先の
# ディレクトリ名が使われ、クローンし直すだけで別プロジェクトになる。
# 旧名(courseregistrationai)から移るときは、旧コンテナが 127.0.0.1:8001 を
# 握ったままだと衝突するため、先に一度だけ消す(§3.2.2):
#   docker compose -p courseregistrationai rm -sf vllm
name: syllabel
services:
  vllm:
    # **タグを固定する。** `latest` は次の pull で実体が黙って変わり、設計書に
    # 記した実測値と合わなくなる(移行前の実体は 0.20.0 / transformers 5.6.2)。
    # 既存の qwen-ocr も v0.24.0 でピン留めされており、運用を揃える(§4.3)
    image: vllm/vllm-openai:v0.27.1
    networks: [app-net]
    ports:
      # 全公開を避け 127.0.0.1 バインド。**この公開は外せない**: DGX の
      # socat-qwen36.service がこのポートへ転送し、教員側のトークンゲートウェイの
      # qwen upstream になっている(§3.4.1、§3.4.3)。
      # ユニット名はモデル名由来のため 3.8 化で実態とずれるが、systemd ユニットは
      # 本リポジトリの管理外であり改名しない(§3.4.1)
      - "127.0.0.1:8001:8000"
    ipc: host                        # vLLM のマルチプロセス共有メモリ用
    volumes:
      - /srv/qwen3.8/models/Qwen3.8-27B-FP8:/models:ro   # 事前DL済みモデルを読み取り専用で渡す
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 900s             # モデルロードに数分かかるため長めに
    command:
      - --model
      - /models                       # 事前DLしたローカルパス。起動時に HF からは取得しない
      - --served-model-name           # §6.3 の OpenAIChatModel(model=...) と一致させ 404 を防ぐ
      - qwen3.8-27b-fp8
      - --language-model-only          # テキスト専用。ビジョンを省きメモリを KV cache に回す
      - --reasoning-parser             # 思考モデルのため必須。無いと思考が本文に漏れ構造化出力が壊れる
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser             # hermes ではなく qwen3_coder(公式指定の出力書式)
      - qwen3_coder
      - --max-model-len                # 既定262144はメモリ過大。最低128K推奨に沿い131072。OOM時さらに削減
      - "131072"
      - --gpu-memory-utilization       # 同一GPUを共有する他ワークロードがある前提で 121GiB に収めるため 0.4
      - "0.4"
      # 単GPU構成のため tensor-parallel は指定しない(=1)

networks:
  app-net:

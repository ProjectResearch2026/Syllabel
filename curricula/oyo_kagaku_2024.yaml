# 応用化学課程 2024年度入学 履修要項データ
# 出典:
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s04/ (教養教育科目)
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s05/ (専攻科目・学修プログラム)
#   http://rishu.ryukoku.ac.jp/knowledge/no5-01/ (履修登録制限単位数)
program: "応用化学課程"
admission_year: 2024
# 卒業要件の定義
graduation_requirements:
  total_credits: 124
  categories:
    - name: "詳細はWebページ画像参照"
      required_credits: null
      notes: "詳細はWebページ画像参照"
  prerequisites:
    - course_title: "特別研究"
      term: "通年"
      grade: 4
      required: true
      conditions: "卒業要件総修得単位数100単位以上"
  internship_cap_credits: 4
  internship_cap_notes: "インターンシップ等（キャリア実習・インターンシップ系）の卒業要件算入上限は4単位（他課程は2単位）"
  grade_up_requirements:
    - to_grade: 2
      conditions: null
    - to_grade: 3
      conditions: null
    - to_grade: 4
      conditions: null
# 履修登録制限単位数(CAP制)の定義
registration_limits:
  by_semester:
    - semesters: [1, 2, 3, 4]   # 1・2年次
      max_credits_per_semester: 22
    - semesters: [5, 6]         # 3年次
      max_credits_per_semester: 24
    - semesters: [7, 8]         # 4年次
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目（教職課程・博物館学芸員課程など）、サマーセッション科目、「海外英語研修」、
    大学コンソーシアム京都の単位互換科目、放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"
# 学修プログラムの定義（応用化学課程関連の詳細不明のため省略）
study_programs: []

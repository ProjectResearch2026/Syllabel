    notes: "「中国語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "スペイン語ⅡA"
    any_of: ["スペイン語ⅠA", "スペイン語ⅠB"]
    notes: "「スペイン語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "スペイン語ⅡB"
    any_of: ["スペイン語ⅠA", "スペイン語ⅠB"]
    notes: "「スペイン語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "スペイン語セミナーⅠＡ"
    any_of: ["スペイン語ⅠA", "スペイン語ⅠB"]
    notes: "「スペイン語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "スペイン語セミナーⅠＢ"
    any_of: ["スペイン語ⅠA", "スペイン語ⅠB"]
    notes: "「スペイン語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "コリア語ⅡＡ"
    any_of: ["コリア語ⅠＡ", "コリア語ⅠＢ"]
    notes: "「コリア語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "コリア語ⅡＢ"
    any_of: ["コリア語ⅠＡ", "コリア語ⅠＢ"]
    notes: "「コリア語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "コリア語セミナーⅠＡ"
    any_of: ["コリア語ⅠＡ", "コリア語ⅠＢ"]
    notes: "「コリア語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "コリア語セミナーⅠＢ"
    any_of: ["コリア語ⅠＡ", "コリア語ⅠＢ"]
    notes: "「コリア語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  # 英語科目の先修制。◇2 は「または」(one_of)、◇3 は指定科目群からの単位数
  # (min_credits の from)で表す。英語総合は各1単位なので「2科目2単位」は2単位と同じ
  - title: "英語コミュニケーションⅡ"
    one_of:
      - min_credits:
          - credits: 2
            from: ["英語総合1（Ａ）", "英語総合1（Ｂ）", "英語総合2（Ａ）", "英語総合2（Ｂ）"]
      - all_of: ["英語コミュニケーションⅠ"]
    notes: "「英語総合1（A）, 1（B）, 2（A）, 2（B）」の内2科目2単位または「英語コミュニケーションⅠ」（2単位）を修得していること"
  - title: "Global Understanding in English"
    min_credits:
      - credits: 4
        from: ["英語総合1（Ａ）", "英語総合1（Ｂ）", "英語総合2（Ａ）", "英語総合2（Ｂ）", "英語総合3"]
    notes: "「英語総合1（A）, 1（B）, 2（A）, 2（B）, 3」のうち4単位以上修得していること"
  - title: "Forum"
    min_credits:
      - credits: 4
        from: ["英語総合1（Ａ）", "英語総合1（Ｂ）", "英語総合2（Ａ）", "英語総合2（Ｂ）", "英語総合3"]
    notes: "「英語総合1（A）, 1（B）, 2（A）, 2（B）, 3」のうち4単位以上修得していること"
# 卒業要件への算入上限。max_credits を超えた分は overflow_to 先に計上し、null はどこにも計上しない
credit_caps:
  - titles: ["教養教育科目特別講義"]
    max_credits: 2
    overflow_to: null
    notes: "設置科目表 備考「「教養教育科目特別講義」は複数の科目が開講されますが、卒業要件単位として認められるのは1科目（2単位）までです。（余剰分はフリーゾーンに計上されません）」"


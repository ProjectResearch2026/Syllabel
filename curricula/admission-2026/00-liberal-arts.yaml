# 教養教育科目(先端理工学部【2026年度入学～】版・全課程共通)
# 出典: https://rishu.ryukoku.ac.jp/organization/no3/ (教育課程＜共通＞ 瀬田キャンパス 先端理工学部【2026年度入学～】・農学部)
# design.md §5.1.3。教養教育科目の要件枠(liberal.*)と設置科目一覧の唯一の定義元。
# 課程ファイルからのパス参照は持たず、同一ディレクトリにあることで対応づける(§4.4.2)。
#
# 2024・2025年度入学版との違い(design §5.1.3):
#   - 科目群の軸が新設された。基礎教養/発展教養(course_group)と8つの科目群(subgroup)を持つ
#   - 設置科目が129件から230件に増え、subcategory に「学部・センター等提供科目」が加わった
#   - 基幹科目の指定がなくなり、人文科学系・社会科学系の各全科目から1科目(2単位)以上が選択必修になった
#   - 履修不可の指定が課程単位から学部単位に変わったため not_available_to_programs は現れない
#   - 卒業要件枠は2024・2025年度入学版と同一(仏教4/言語6/スポーツ2/人文2/社会2/選択12 = 28単位)
#
# - シラバスコードは持たない。開講年度ファイル(offerings/<開講年度>/admission-2026/00-liberal-arts.yaml)が
#   科目名で結合する(§5.1.1)
# - 人文科学系・社会科学系の選択必修枠は、2024・2025年度入学版と同じく {subcategory, type: "選択必修"}
#   で受ける。基幹科目の指定が無いため、枠の名前に〈基幹〉を付けない
# - course_group / subgroup は設置科目表の「基礎/発展」「科目群」欄に対応する。科目群欄が
#   「学部等提供／アドバンスト」のように複数の値をとる行は先頭の値を subgroup に採り、原文を notes に
#   残した。1科目が基礎教養と発展教養の両方に属する行(原典で rowspan により2行に分かれる)は
#   基礎教養側を採り、発展教養側を notes に残した
# - quarters は持たない。教養教育科目はクォーター制の対象外である(§5.1.3・§5.1.5)。設置科目表の列は
#   「配当セメ」のみで、原典にクォーターの表記がない
admission_year: 2026                # このファイルが属するコホート。ディレクトリ名と一致させる
liberal_arts_version: "2026"        # 履修要項の版(先端理工学部【2026年度入学～】)
applies_to: ["先端理工学部"]
duplicate_of: null                  # 複製元。このファイルが原本のため null

# 教養教育科目の卒業要件枠(合計28単位)。accepts の記法は §5.1.5
requirement_slots:
  - key: "liberal.buddhism"
    name: "教養教育科目(必修・仏教)"
    credits: 4
    accepts: {subcategory: "「仏教の思想」科目", type: "必修"}
  - key: "liberal.language.required"
    name: "教養教育科目(必修・言語)"
    credits: 6
    accepts: {subcategory: "必修外国語科目"}
    overflow_to: "liberal.elective"           # 履修要項 注記A
  - key: "liberal.general.humanities"
    name: "教養教育科目(選択必修・人文)"
    credits: 2
    accepts: {subcategory: "人文科学系科目", type: "選択必修"}
    overflow_to: "liberal.elective"
    notes: "人文科学系科目の全科目から1科目(2単位)以上"
  - key: "liberal.general.social"
    name: "教養教育科目(選択必修・社会)"
    credits: 2
    accepts: {subcategory: "社会科学系科目", type: "選択必修"}
    overflow_to: "liberal.elective"
    notes: "社会科学系科目の全科目から1科目(2単位)以上"
  - key: "liberal.general.sports"
    name: "教養教育科目(必修・スポーツ)"
    credits: 2
    accepts: {subcategory: "スポーツ科学系科目", type: "必修"}
  - key: "liberal.elective"
    name: "教養教育科目(選択)"
    credits: 12
    accepts: {category: "教養教育科目"}       # 上位枠に収まらない教養教育科目の受け皿
    overflow_to: "free.all"                   # 参照先は課程ファイル。解決はマージ後(§4.4.3)

prerequisites:
  # 先修制。出典 /organization/no3/ の「3. 言語科目 (3)選択外国語科目の履修 ⑥選択外国語科目の先修制」の表と、
  # 「学部・センター等提供科目」表の脚注 ◇2・◇3。原典は「ドイツ語ⅡＡ、ⅡＢ」と2科目を1行にまとめているが、
  # 要件は各科目に個別にかかるため1科目1エントリに展開した。
  # 2024・2025年度入学版との差分: 対象がセミナー科目のみからⅡ系にも拡大し、スペイン語が新設された。
  # 要件側も「ⅠA、ⅠB、ⅡA、ⅡB」から「ⅠA、ⅠB」に狭まっている。
  - title: "ドイツ語ⅡＡ"
    any_of: ["ドイツ語ⅠＡ", "ドイツ語ⅠＢ"]
    notes: "「ドイツ語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "ドイツ語ⅡＢ"
    any_of: ["ドイツ語ⅠＡ", "ドイツ語ⅠＢ"]
    notes: "「ドイツ語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "ドイツ語セミナーⅠＡ"
    any_of: ["ドイツ語ⅠＡ", "ドイツ語ⅠＢ"]
    notes: "「ドイツ語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "ドイツ語セミナーⅠＢ"
    any_of: ["ドイツ語ⅠＡ", "ドイツ語ⅠＢ"]
    notes: "「ドイツ語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "フランス語ⅡＡ"
    any_of: ["フランス語ⅠＡ", "フランス語ⅠＢ"]
    notes: "「フランス語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "フランス語ⅡＢ"
    any_of: ["フランス語ⅠＡ", "フランス語ⅠＢ"]
    notes: "「フランス語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "フランス語セミナーⅠＡ"
    any_of: ["フランス語ⅠＡ", "フランス語ⅠＢ"]
    notes: "「フランス語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "フランス語セミナーⅠＢ"
    any_of: ["フランス語ⅠＡ", "フランス語ⅠＢ"]
    notes: "「フランス語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "中国語ⅡＡ"
    any_of: ["中国語ⅠＡ", "中国語ⅠＢ"]
    notes: "「中国語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "中国語ⅡＢ"
    any_of: ["中国語ⅠＡ", "中国語ⅠＢ"]
    notes: "「中国語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "中国語セミナーⅠＡ"
    any_of: ["中国語ⅠＡ", "中国語ⅠＢ"]
    notes: "「中国語ⅠA、ⅠＢ」の中からいずれかの1単位の修得"
  - title: "中国語セミナーⅠＢ"

# 先端理工学部 2026年度入学者向け 教養教育科目
# 出典: https://rishu.ryukoku.ac.jp/organization/no3/ （教育課程＜共通＞・瀬田キャンパス）
#   「6. 教養教育科目開設科目」の HTML テーブルから機械転記した。
# 2024・2025年度入学版との違い(design §5.1.3):
#   - 科目群の軸が新設された。基礎教養/発展教養(course_group)と8つの科目群(subgroup)を持つ
#   - 設置科目が129件から大幅に増えた
#   - 履修不可の指定が課程単位から学部単位に変わったため not_available_to_programs は現れない
#   - 卒業要件枠は2024・2025年度入学版と同一(仏教4/言語6/スポーツ2/人文2/社会2/選択12 = 28単位)
# design との差異(要監修):
#   - 科目群欄が「学部等提供／アドバンスト」のように複数値をとる行がある。先頭の値を subgroup に採り、
#     原文は notes に残した
#   - 1科目が基礎教養と発展教養の両方に属する行がある(原典で rowspan により2行に分かれる)。
#     基礎教養側を course_group / subgroup に採り、もう一方は notes に残した
# 転記対象外:
#   - 理工学のすすめ（先端理工学部提供科目【先端理工学部履修不可】）
#   - 教養教育科目特別講義（対象：農学部 「教養教育科目特別講義」は複数の科目が開講されますが、卒業要件単位）

admission_year: 2026
liberal_arts_version: "2026"
applies_to: ["先端理工学部"]
duplicate_of: null

requirement_slots:                  # 卒業要件単位（最低）数表(各課程共通)から転記
  - key: "liberal.buddhism"
    credits: 4
    accepts: {subcategory: "「仏教の思想」科目", type: "必修"}
  - key: "liberal.language.required"
    credits: 6
    accepts: {subcategory: "必修外国語科目"}
    overflow_to: "liberal.elective"
  - key: "liberal.general.humanities"
    credits: 2
    accepts: {subcategory: "人文科学系科目", kikan: true}
    overflow_to: "liberal.elective"
  - key: "liberal.general.social"
    credits: 2
    accepts: {subcategory: "社会科学系科目", kikan: true}
    overflow_to: "liberal.elective"
  - key: "liberal.general.sports"
    credits: 2
    accepts: {subcategory: "スポーツ科学系科目", type: "必修"}
  - key: "liberal.elective"
    credits: 12
    accepts: {category: "教養教育科目"}
    overflow_to: "free.all"


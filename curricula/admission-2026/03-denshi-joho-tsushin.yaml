      - "先端理工キャリア実習Ⅰ"
      - "先端理工インターンシップⅠ"
      - "先端理工キャリア実習Ⅱ"
      - "先端理工インターンシップⅡ"
    max_credits: 2
    overflow_to: null
  - titles:
      - "プロジェクトリサーチⅠ"
      - "プロジェクトリサーチⅡ"
    max_credits: 2
    overflow_to: null


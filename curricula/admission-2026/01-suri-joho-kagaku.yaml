# 先端理工学部 数理・情報科学課程 2026年度入学者向け履修要項
# 出典: https://rishu.ryukoku.ac.jp/curriculum/faculty-rikou/s04/ （年度を含まないURLが最新年度）
#   設置科目・先修制・進級要件・別表は HTML テーブルから機械転記した（2026年度版は画像化されていない）。
#   卒業要件単位（最低）数表のみ画像のため、拡大して読み取り合計124単位を検算した。
# 未確定: registration_limits（履修登録制限単位数）の出典が上記ページに無いため 2025年度入学版の値を暫定で置いている。要確認。

program:
  code: "01"
  name: "数理・情報科学課程"
  name_aliases: []
admission_year: 2026
curriculum_version: "2026年度以降入学生"
duplicate_of: null

graduation:
  total_credits: 124
  excluded_types: ["随意"]

requirement_slots:                  # 卒業要件単位（最低）数表から転記
  - key: "basic.required"
    credits: 9
    accepts: {category: "専門基礎科目", type: "必修"}
  - key: "basic.elective"
    credits: 0
    accepts: {category: "専門基礎科目", type: ["選択必修", "選択"]}
    overflow_to: "free.faculty"           # 注記B
  - key: "applied.required"
    credits: 18
    accepts: {category: "専門応用科目", type: "必修"}
  - key: "applied.required_elective"
    credits: 22
    accepts: {category: "専門応用科目", type: "選択必修"}
    overflow_to: "applied.elective"           # 注記C
  - key: "applied.elective"
    credits: 31
    accepts: {category: "専門応用科目", type: "選択"}
    overflow_to: "free.faculty"
  - key: "related"
    credits: 0
    accepts: {category: "専門関連科目"}
    overflow_to: "free.faculty"           # 注記D
  - key: "free.faculty"
    credits: 6
    accepts: {category: ["専門基礎科目", "専門応用科目", "専門関連科目"]}
    overflow_to: "free.all"           # 注記E
  - key: "free.all"
    credits: 10
    accepts: {category: "any"}
    # 注記F

tracks:                             # 別表「コース毎の履修要件」から転記
  - key: "math"
    name: "数学系コース"
    constraints:
      - {slot: "applied.required_elective", track_group: "数学系", pool: 18, min: 13}
      - {slot: "applied.elective", track_group: "数学系", pool: 21, min: 14}
  - key: "info"
    name: "情報系コース"
    constraints:
      - {slot: "applied.required_elective", track_group: "情報系", pool: 13, min: 9}
      - {slot: "applied.elective", track_group: "情報系", pool: 25, min: 14}
  - key: "sogo"
    name: "総合コース"
    constraints:
      - {slot: "applied.required_elective", track_group: "数学系", pool: 18, min: 9}
      - {slot: "applied.required_elective", track_group: "情報系", pool: 13, min: 4}

prerequisites:                      # 先修制(専攻科目)。「（2）先修制（専攻科目）」の表から転記
  - title: "数理情報演習"
    min_credits:
      - {credits: 52}
    notes: "卒業要件総修得単位数52単位以上であること。"
  - title: "セミナーⅠ"
    as_of: {grade: 2, term: "後期"}
    min_credits:
      - {credits: 52}
    notes: "履修の前年度終了時点で卒業要件総修得単位数52単位以上であること。"
  - title: "セミナーⅡ"
    min_credits:
      - {credits: 76}
      - {accepts: {category: "専門応用科目"}, credits: 37}
    notes: "卒業要件総修得単位数76単位以上、かつ専門応用科目の修得単位数37単位以上であること。"
  - title: "特別研究Ⅰ"
    min_credits:
      - {credits: 76}
      - {accepts: {category: "専門応用科目"}, credits: 37}
    notes: "卒業要件総修得単位数76単位以上、かつ専門応用科目の修得単位数37単位以上であること。"
  - title: "特別研究Ⅱ"
    all_of: ["特別研究Ⅰ", "セミナーⅡ"]
    notes: "「特別研究Ⅰ」および「セミナーⅡ」を修得していること。"

grade_up_requirements:
  - to_grade: 2
    conditions: null
  - to_grade: 3
    conditions: null
  - to_grade: 4
    conditions: null

registration_limits:                # 出典未確認（2025年度入学版からの暫定値）
  by_semester:
    - semesters: [1, 2, 3, 4]
      max_credits_per_semester: 22
    - semesters: [5, 6]
      max_credits_per_semester: 24
    - semesters: [7, 8]
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目、サマーセッション科目、「海外英語研修」、大学コンソーシアム京都の単位互換科目、
    放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"

credit_caps:                        # 設置科目表の備考から転記
  - titles: ["プロジェクトリサーチⅠ", "プロジェクトリサーチⅡ", "キャリア実習・実習指導", "先端理工キャリア実習Ⅰ", "先端理工インターンシップⅠ", "先端理工キャリア実習Ⅱ", "先端理工インターンシップⅡ"]
    max_credits: 2
    overflow_to: null
    notes: "これら科目のうち、卒業要件単位として認められるのは2単位までです。"


# 先端理工学部 機械工学・ロボティクス課程 2026年度入学者向け履修要項
# 出典: https://rishu.ryukoku.ac.jp/curriculum/faculty-rikou/s04/ （年度を含まないURLが最新年度）
#   設置科目・先修制・進級要件・別表は HTML テーブルから機械転記した（2026年度版は画像化されていない）。
#   卒業要件単位（最低）数表のみ画像のため、拡大して読み取り合計124単位を検算した。
#   registration_limits（履修登録制限単位数）は上記ページに無く、
#   https://rishu.ryukoku.ac.jp/knowledge/no5-01/ の【5】履修登録「2．履修登録制限単位数」
#   の先端理工学部の表から転記した。

program:
  code: "04"
  name: "機械工学・ロボティクス課程"
  name_aliases: []
admission_year: 2026
curriculum_version: "2026年度以降入学生"
duplicate_of: null

graduation:
  total_credits: 124
  excluded_types: ["随意"]

requirement_slots:                  # 卒業要件単位（最低）数表から転記
  - key: "basic.required"
    name: "専門基礎科目(必修)"
    credits: 17
    accepts: {category: "専門基礎科目", type: "必修"}
  - key: "basic.elective"
    name: "専門基礎科目(選択)"
    credits: 0
    accepts: {category: "専門基礎科目", type: "選択"}
    overflow_to: "free.faculty"           # 注記B
  - key: "applied.required"
    name: "専門応用科目(必修)"
    credits: 37
    accepts: {category: "専門応用科目", type: "必修"}
  - key: "applied.elective"
    name: "専門応用科目(選択)"
    credits: 32
    accepts: {category: "専門応用科目", type: "選択"}
    overflow_to: "free.faculty"
  - key: "related"
    name: "専門関連科目"
    credits: 0
    accepts: {category: "専門関連科目"}
    overflow_to: "free.faculty"           # 注記C
  - key: "free.faculty"
    name: "学部フリーゾーン"
    credits: 10
    accepts: {category: ["専門基礎科目", "専門応用科目", "専門関連科目"]}
    # 注記D
  - key: "free.all"
    name: "オールフリーゾーン"
    credits: 0
    accepts: {category: "any"}
    # この課程にオールフリーゾーンは無い。卒業要件単位数表に当該行が存在しないため credits: 0 とし、liberal.elective の overflow_to 先としてのみ機能する

prerequisites:                      # 先修制(専攻科目)。「（2）先修制（専攻科目）」の表から転記
  - title: "セミナー"
    as_of: {grade: 3, term: "前期"}
    min_credits:
      - {credits: 80}
      - {accepts: {category: ["専門基礎科目", "専門応用科目"], type: "必修"}, credits: 31}
    notes: "3年第1学期（前期）の終了時点で、卒業要件総修得単位数80単位以上、かつ必修科目修得単位数31単位以上であること。※9月の成績表配付までに成績確定する科目を含む。"

grade_up_requirements:
  - to_grade: 2
    conditions: "必修科目14単位以上かつ卒業要件総修得単位数30単位以上。「微分積分」「基礎力学Ⅰ」を単位修得していること"
  - to_grade: 3
    conditions: null
    notes: "取得単位数の要件を設けない"
  - to_grade: 4
    conditions: "必修科目53単位以上かつ卒業要件総修得単位数102単位以上。「セミナー」を単位修得していること"

registration_limits:                # 出典: knowledge/no5-01/【5】履修登録「2．履修登録制限単位数」
  by_semester:
    - semesters: [1, 2, 3, 4]
      max_credits_per_semester: 22
    - semesters: [5, 6]
      max_credits_per_semester: 24
    - semesters: [7, 8]
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目、サマーセッション科目、「海外英語研修」、大学コンソーシアム京都の単位互換科目、
    放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"

credit_caps:                        # 設置科目表の備考から転記
  - titles: ["プロジェクトリサーチⅠ", "プロジェクトリサーチⅡ", "キャリア実習・実習指導", "ASEANグローバルプログラム", "グローバル人材育成プログラム", "先端理工キャリア実習Ⅰ", "先端理工インターンシップⅠ", "先端理工キャリア実習Ⅱ", "先端理工インターンシップⅡ"]
    max_credits: 2
    overflow_to: null
    notes: "これら科目のうち、卒業要件単位として認められるのは2単位までです。"


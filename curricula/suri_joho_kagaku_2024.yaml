# 数理・情報科学課程 2024年度入学 履修要項データ
# 出典:
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s04/ (教養教育科目)
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s05/ (専攻科目・学修プログラム)
#   http://rishu.ryukoku.ac.jp/knowledge/no5-01/ (履修登録制限単位数)
# 構成:
#   graduation_requirements - 卒業要件単位数・進級条件
#   registration_limits     - 履修登録制限単位数(CAP制)
#   courses                 - 各科目の詳細情報
# 注記:
#   専門科目の詳細（単位数・必修区分・クォーター等）はWebページが画像形式のため、
#   テキストから読み取れた情報のみ記載。画像確認が必要な箇所は notes に明記。
program: "数理・情報科学課程"
admission_year: 2024
syllabus_codes_year: 2026  # courses の syllabus_codes の取得元開講年度(design.md §5.1)
# コース区分（数学系・情報系・総合コース）
courses_tracks:
  - id: "math"
    name: "数学系コース"
    notes: "選択必修：数学系18単位中13単位以上、情報系13単位中9単位以上。選択：数学系21単位中14単位以上"
  - id: "info"
    name: "情報系コース"
    notes: "選択必修：数学系18単位中9単位以上、情報系13単位中4単位以上。選択：情報系25単位中14単位以上"
  - id: "sogo"
    name: "総合コース"
    notes: "選択必修：22単位以上（内訳の制限なし）"
# 卒業要件の定義
graduation_requirements:
  total_credits: 124
  categories:
    - name: "教養教育科目"
      required_credits: 28
      notes: "仏教必修・言語必修・スポーツ必修・選択必修・選択の合計"
    - name: "仏教必修"
      required_credits: 4
    - name: "言語必修"
      required_credits: 6
    - name: "スポーツ必修"
      required_credits: 2
    - name: "教養選択必修（人文）"
      required_credits: 2
      notes: "人文科学系の選択必修（基幹科目）から1科目2単位以上を修得する"
    - name: "教養選択必修（社会）"
      required_credits: 2
      notes: "社会科学系の選択必修（基幹科目）から1科目2単位以上を修得する"
    - name: "教養選択"
      required_credits: 12
      notes: "教養教育科目の選択必修（基幹科目）の余剰修得単位はここに計上される"
    - name: "専門基礎科目"
      required_credits: 9
      notes: "専門基礎必修のみ（選択科目に要件枠はない）"
    - name: "専門基礎必修"
      required_credits: 9
    - name: "専門基礎選択"
      required_credits: 0
      notes: "要件枠なし。修得単位は学部フリーゾーンまたはオールフリーゾーンに算入する"
    - name: "専門応用科目"
      required_credits: 71
      notes: "専門応用必修・専門応用選択必修・専門応用選択の合計。数学系・情報系・総合のいずれか一つのコースを選択する。数学系または情報系コースを選択した場合は別表に定めるコース毎の履修要件を満たす必要がある（総合コースは卒業要件単位数を揃えれば自動的に満たされる）"
    - name: "専門応用必修"
      required_credits: 18
    - name: "専門応用選択必修"
      required_credits: 22
      notes: "選択必修科目の余剰修得単位は専門応用選択として計上される。コースにより内訳の最低単位数が異なる"
    - name: "専門応用選択"
      required_credits: 31
      notes: "コースにより最低単位数が異なる"
    - name: "専門関連選択"
      required_credits: 0
      notes: "専門関連科目とは、所属する課程以外の他課程が主体となって開講する専攻科目(学修プログラムに含まれる科目など)。修得単位は学部フリーゾーンまたはオールフリーゾーンに算入する"
    - name: "学部フリーゾーン"
      required_credits: 6
      notes: "専門基礎・専門応用・専門関連から区分を問わず修得可。随意科目は除く"
    - name: "オールフリーゾーン"
      required_credits: 10
      notes: "教養教育科目を含め区分を問わず修得可。随意科目は除く"
  # 進級・先修要件
  prerequisites:
    - course_title: "数理情報演習"
      term: "前期"
      quarters: ["1Q"]
      grade: 3
      required: true
      conditions: "卒業要件総修得単位数52単位以上"
    - course_title: "セミナーⅠ"
      term: "後期"
      grade: 3
      required: true
      conditions: "前年度終了時点で卒業要件総修得単位数52単位以上"
    - course_title: "セミナーⅡ"
      term: "前期"
      grade: 4
      required: true
      conditions: "卒業要件総修得76単位以上、かつ専門応用科目37単位以上"
    - course_title: "特別研究Ⅰ"
      term: "前期"
      grade: 4
      required: true
      conditions: "卒業要件総修得76単位以上、かつ専門応用科目37単位以上"
    - course_title: "特別研究Ⅱ"
      term: "後期"
      grade: 4
      required: true
      conditions: "「特別研究Ⅰ」および「セミナーⅡ」を修得していること"
  grade_up_requirements:
    - to_grade: 2
      conditions: null
    - to_grade: 3
      conditions: null
    - to_grade: 4
      conditions: null
# 履修登録制限単位数(CAP制)の定義
registration_limits:
  by_semester:
    - semesters: [1, 2, 3, 4]
      max_credits_per_semester: 22
    - semesters: [5, 6]
      max_credits_per_semester: 24
    - semesters: [7, 8]
      max_credits_per_year: 48
      notes: "4年次は通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目（教職課程・博物館学芸員課程など）、サマーセッション科目、「海外英語研修」、
    大学コンソーシアム京都の単位互換科目、放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"
# 各授業の定義
# - type: 必修 / 選択必修 / 選択 / 随意
# - grade・term・quarters: 配当年次・学期・クォーター
# - track: 対応コース（math=数学系, info=情報系, sogo=総合, all=全コース共通の選択必修）
# - 注記: 専門科目の詳細（単位数・クォーター等）はWebページが画像形式のため不完全な場合あり

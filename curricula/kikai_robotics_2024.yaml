# 機械工学・ロボティクス課程 2024年度入学 履修要項データ
# 出典:
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s04/ (教養教育科目)
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s08/ (専攻科目・学修プログラム)
#   http://rishu.ryukoku.ac.jp/knowledge/no5-01/ (履修登録制限単位数)
# 構成:
#   graduation_requirements - 卒業要件単位数・進級条件
#   registration_limits     - 履修登録制限単位数(CAP制)
#   study_programs          - 学修プログラム(科目の programs 欄が参照する凡例)
#   courses                 - 各科目の詳細情報
program: "機械工学・ロボティクス課程"
admission_year: 2024
# 卒業要件の定義
graduation_requirements:
  total_credits: 124
  categories:
    - name: "教養教育科目"
      notes: "詳細はWebページ画像参照"
    - name: "専門基礎科目"
      notes: "詳細はWebページ画像参照"
    - name: "専門応用科目"
      notes: "詳細はWebページ画像参照"
  # 進級・先修要件の定義
  prerequisites:
    - course_title: "セミナー"
      term: "後期"
      grade: 3
      required: true
      conditions: "3年前期終了時点で卒業要件総修得単位数80単位以上、かつ必修科目修得単位数31単位以上"
  grade_up_requirements:
    - to_grade: 2
      conditions: null
    - to_grade: 3
      conditions: null
    - to_grade: 4
      conditions: "「セミナー」を単位修得していること"
# 履修登録制限単位数(CAP制)の定義
registration_limits:
  by_semester:
    - semesters: [1, 2, 3, 4]   # 1・2年次
      max_credits_per_semester: 22
    - semesters: [5, 6]         # 3年次
      max_credits_per_semester: 24
    - semesters: [7, 8]         # 4年次
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目（教職課程・博物館学芸員課程など）、サマーセッション科目、「海外英語研修」、
    大学コンソーシアム京都の単位互換科目、放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"
# 学修プログラムの定義(courses の programs 欄の番号に対応。機械工学・ロボティクス課程の科目が関わるもののみ)
study_programs:
  - number: 11
    name: "モバイルロボティクス"
    notes: "責任課程は機械工学・ロボティクス課程"
  - number: 12
    name: "先進機械工学"
    notes: "責任課程は機械工学・ロボティクス課程"
  - number: 13
    name: "航空宇宙"
    notes: "責任課程は機械工学・ロボティクス課程"
  - number: 14
    name: "先端ロボティクス"
    notes: "責任課程は機械工学・ロボティクス課程（○提供）"
  - number: 15
    name: "バイオニックデザイン"
    notes: "責任課程は機械工学・ロボティクス課程（○提供）"
  - number: 16
    name: "先進エコマテリアル"
    notes: "責任課程は機械工学・ロボティクス課程"
# 各授業の定義

# 知能情報メディア課程 2024年度入学 履修要項データ
# 構成:
#   graduation_requirements - 卒業要件単位数・進級条件
#   courses                 - 各科目の詳細情報
program: "知能情報メディア課程"
admission_year: 2024
# 卒業要件の定義
graduation_requirements:
  total_credits: 124
  categories:
    - name: "教養教育科目"
      required_credits: 28
      notes: "仏教必修・言語必修・スポーツ必修・選択必修・選択の合計"
    - name: "仏教必修"
      required_credits: 4
    - name: "言語必修"
      required_credits: 6
    - name: "スポーツ必修"
      required_credits: 2
    - name: "教養選択必修（人文）"
      required_credits: 2
    - name: "教養選択必修（社会）"
      required_credits: 2
    - name: "教養選択"
      required_credits: 12
      notes: "教養教育科目の選択必修（基幹科目）の余剰修得単位はここに計上される"
    - name: "専門基礎科目"  
      required_credits: 38
      notes: "専門基礎必修・専門基礎選択の合計"
    - name: "専門基礎必修"
      required_credits: 28
    - name: "専門基礎選択"
      required_credits: 10
    - name: "専門応用科目"
      required_credits: 40
      notes: "専門応用必修・専門応用選択の合計"
    - name: "専門応用必修"
      required_credits: 18
    - name: "専門応用選択"
      required_credits: 22
    - name: "専門関連選択"
      required_credits: 0
      notes: "修得単位は学部フリーゾーンまたはオールフリーゾーンに算入する"
    - name: "学部フリーゾーン"
      required_credits: 10
      notes: "専門基礎・専門応用・専門関連から区分を問わず修得可。随意科目は除く"
    - name: "オールフリーゾーン"
      required_credits: 8
      notes: "教養教育科目を含め区分を問わず修得可。随意科目は除く"
  # 進級要件の定義
  prerequisites:
    - course_title: "知能情報メディアセミナー"
      term: "後期"
      grade: 3
      required: true
      conditions: "3年前期終了時点で卒業要件総修得単位数80単位以上、かつ専門基礎科目（必修）の修得単位数20単位以上"
  grade_up_requirements:
    - to_grade: 2
      conditions: null
    - to_grade: 3
      conditions: null
    - to_grade: 4
      conditions: "「知能情報メディアセミナー」を単位修得していること"
# 各授業の定義
courses: []

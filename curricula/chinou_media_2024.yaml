# 知能情報メディア課程 2024年度入学 履修要項データ
# 出典:
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s04/ (教養教育科目)
#   https://rishu.ryukoku.ac.jp/curriculum/2024/faculty-rikou/s05/ (専攻科目・学修プログラム)
#   http://rishu.ryukoku.ac.jp/knowledge/no5-01/ (履修登録制限単位数)
# 構成:
#   graduation_requirements - 卒業要件単位数・進級条件
#   registration_limits     - 履修登録制限単位数(CAP制)
#   study_programs          - 学修プログラム(科目の programs 欄が参照する凡例)
#   courses                 - 各科目の詳細情報
program: "知能情報メディア課程"
admission_year: 2024
syllabus_codes_year: 2026   # courses の syllabus_codes の取得元開講年度(design.md §5.1)
# 卒業要件の定義
graduation_requirements:
  total_credits: 124
  categories:
    - name: "教養教育科目"
      required_credits: 28
      notes: "仏教必修・言語必修・スポーツ必修・選択必修・選択の合計"
    - name: "仏教必修"
      required_credits: 4
    - name: "言語必修"
      required_credits: 6
    - name: "スポーツ必修"
      required_credits: 2
    - name: "教養選択必修（人文）"
      required_credits: 2
      notes: "人文科学系の選択必修（基幹科目）から1科目2単位以上を修得する"
    - name: "教養選択必修（社会）"
      required_credits: 2
      notes: "社会科学系の選択必修（基幹科目）から1科目2単位以上を修得する"
    - name: "教養選択"
      required_credits: 12
      notes: "教養教育科目の選択必修（基幹科目）の余剰修得単位はここに計上される"
    - name: "専門基礎科目"
      required_credits: 38
      notes: "専門基礎必修・専門基礎選択の合計"
    - name: "専門基礎必修"
      required_credits: 28
    - name: "専門基礎選択"
      required_credits: 10
    - name: "専門応用科目"
      required_credits: 40
      notes: "専門応用必修・専門応用選択の合計"
    - name: "専門応用必修"
      required_credits: 18
    - name: "専門応用選択"
      required_credits: 22
    - name: "専門関連選択"
      required_credits: 0
      notes: "専門関連科目とは、所属する課程以外の他課程が主体となって開講する専攻科目(学修プログラムに含まれる科目など)。修得単位は専門基礎選択・専門応用選択には算入されず、学部フリーゾーンまたはオールフリーゾーンに算入する"
    - name: "学部フリーゾーン"
      required_credits: 10
      notes: "専門基礎・専門応用・専門関連から区分を問わず修得可。随意科目は除く"
    - name: "オールフリーゾーン"
      required_credits: 8
      notes: "教養教育科目を含め区分を問わず修得可。随意科目は除く"
  # 進級要件の定義
  prerequisites:
    - course_title: "知能情報メディアセミナー"
      term: "後期"
      grade: 3
      required: true
      conditions: "3年前期終了時点で卒業要件総修得単位数80単位以上、かつ専門基礎科目（必修）の修得単位数20単位以上"
  grade_up_requirements:
    - to_grade: 2
      conditions: null
    - to_grade: 3
      conditions: null
    - to_grade: 4
      conditions: "「知能情報メディアセミナー」を単位修得していること"
# 履修登録制限単位数(CAP制)の定義
registration_limits:
  by_semester:
    - semesters: [1, 2, 3, 4]   # 1・2年次
      max_credits_per_semester: 22
    - semesters: [5, 6]         # 3年次
      max_credits_per_semester: 24
    - semesters: [7, 8]         # 4年次
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目（教職課程・博物館学芸員課程など）、サマーセッション科目、「海外英語研修」、
    大学コンソーシアム京都の単位互換科目、放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"
# 学修プログラムの定義(courses の programs 欄の番号に対応。知能情報メディア課程の科目が関わるもののみ)
study_programs:
  - number: 4
    name: "データサイエンス"
    min_credits: 14
    notes: "科目群A・B・Cのいずれかで14単位。責任課程は数理・情報科学課程"
  - number: 5
    name: "リアル＆バーチャルメディア"
    min_credits: 12
    notes: "責任課程は知能情報メディア課程"
  - number: 6
    name: "応用ソフトウェア"
    min_credits: 12
    notes: "責任課程は知能情報メディア課程"
  - number: 7
    name: "人工知能"
    min_credits: 12
    notes: "責任課程は知能情報メディア課程"
  - number: 14
    name: "先端ロボティクス"
    min_credits: 14
    notes: "責任課程は機械工学・ロボティクス課程"
  - number: 15
    name: "バイオニックデザイン"
    min_credits: 14
    notes: "責任課程は機械工学・ロボティクス課程"
# 各授業の定義

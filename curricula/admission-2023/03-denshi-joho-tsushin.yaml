# 電子情報通信課程 2023年度入学 履修要項データ
# 出典:
#   https://cweb.ryukoku.ac.jp/~kyoga/rishu/pdf/01/2023/Y2023youkou20230324_3Elect.pdf
#     2023年度版 履修要項(冊子) 第1部 Ⅴ-2 履修登録制限単位数(p.11)、
#     第2部 ❷専攻科目の履修方法【2023年度以降入学生】(p.39〜43)
#   https://cweb.ryukoku.ac.jp/~kyoga/rishu/pdf/02/2024/Y2023henko20250306.pdf
#     冊子配付後の変更点(2023年度入学生)
#   履修要項Webサイトは2024年度以降しか公開していないため、2023年度版はPDFのみが原典となる。
#   PDFはテキストを PyMuPDF で座標付きに抽出し、設置科目表のマーク位置から配当年次・学期・
#   クォーターを判定した(中央=単一クォーター、境界=セメスター、前期と後期の境界=通年)。
#   admission-2024 と全項目を照合し、相違はキャリア・インターンシップ系の科目名、
#   「ディジタル論理」のクォーター(下記)、変更点による「理工学のすすめ」の履修可能年次の
#   削除のみであった(科目81件・卒業要件・先修制6件・進級要件・CAP はすべて一致)。
#   設置科目表の「量子力学【隔年開講】」「結晶工学【隔年開講】」は科目名のセルに注記が入った
#   ものであり(注意事項6)、科目名は「量子力学」「結晶工学」とし隔年開講は notes に置く。
# 構成:
#   graduation / requirement_slots - 卒業要件の総単位数と要件枠
#   credit_caps                    - 特定科目群の卒業要件算入上限
#   registration_limits            - 履修登録制限単位数(CAP制)
#   courses                        - 専攻科目(教養教育科目は 00-liberal-arts.yaml)
program:
  code: "03"                        # 課程コード2桁。シラバスコード先頭4桁(Y003)と一致する一次識別子
  name: "電子情報通信課程"
  name_aliases: []
admission_year: 2023
curriculum_version: "2023年度以降入学生"      # 履修要項の見出しの版表記(§4.4.1)
duplicate_of: null                  # 他コホートの複製ではないため null(§5.1.2)
graduation:
  total_credits: 124
  excluded_types: ["随意"]            # 卒業要件単位に算入しない type

# 専攻科目・フリーゾーンの要件枠。liberal.* は共通ファイルが持つ(design §5.1.2)
# 合計 96 + 教養 28 = 124 単位。検算はマージ後に行う(§4.4.3)
requirement_slots:
  - key: "basic.required"
    name: "専門基礎科目(必修)"
    credits: 19
    accepts: {category: "専門基礎科目", type: "必修"}
  - key: "basic.required_elective"
    name: "専門基礎科目(選択必修)"
    credits: 13
    accepts: {category: "専門基礎科目", type: "選択必修"}
    overflow_to: "basic.elective"
  - key: "basic.elective"
    name: "専門基礎科目(選択)"
    credits: 18
    accepts: {category: "専門基礎科目", type: "選択"}
    overflow_to: "free.faculty"           # 注記B
  - key: "applied.required"
    name: "専門応用科目(必修)"
    credits: 10
    accepts: {category: "専門応用科目", type: "必修"}
  - key: "applied.required_elective"
    name: "専門応用科目(選択必修)"
    credits: 6
    accepts: {category: "専門応用科目", type: "選択必修"}
    overflow_to: "applied.elective"           # 注記C
  - key: "applied.elective"
    name: "専門応用科目(選択)"
    credits: 18
    accepts: {category: "専門応用科目", type: "選択"}
    overflow_to: "free.faculty"
  - key: "related"
    name: "専門関連科目"
    credits: 0
    accepts: {category: "専門関連科目"}
    overflow_to: "free.faculty"           # 注記D 他課程ファイルから導出(§4.4.3)
  - key: "free.faculty"
    name: "学部フリーゾーン"
    credits: 12
    accepts: {category: ["専門基礎科目", "専門応用科目", "専門関連科目"]}
    overflow_to: "free.all"           # 注記E 教養教育科目は不可
  - key: "free.all"
    name: "オールフリーゾーン"
    credits: 0
    accepts: {category: "any"}
    # 注記F 区分を問わない
    notes: "この課程にはオールフリーゾーンの枠がない(履修要項で確認済)ため0単位。00-liberal-arts.yaml の liberal.elective.overflow_to 先を解決するために枠だけ置いている。教養選択の12単位を超えた分は卒業要件に算入されない"

prerequisites:                      # 先修制(専攻科目)。履修要項「（2）先修制（専攻科目）」の表から転記
  - title: "電子情報通信実験Ⅰ"
    min_credits:
      - {credits: 24}
    notes: "卒業要件総修得単位数が24単位以上であること。"
  - title: "電子情報通信実験Ⅱ"
    min_credits:
      - {credits: 36}
    notes: "卒業要件総修得単位数が36単位以上であること。"
  - title: "応用セミナー"
    notes: "研究室に配属されていること。"
  - title: "専門基礎研究"
    notes: "研究室に配属されていること。"
  - title: "科学技術英語"
    min_credits:
      - {credits: 100}
    notes: "卒業要件総修得単位数が100単位以上であること。"
  - title: "特別研究"
    min_credits:
      - {credits: 100}
    notes: "卒業要件総修得単位数が100単位以上であること。"

grade_up_requirements:              # 進級要件
  - to_grade: 2
    conditions: null
  - to_grade: 3
    conditions: null
  - to_grade: 4
    conditions: null

# 履修登録制限単位数(CAP制)の定義
registration_limits:
  by_semester:
    - semesters: [1, 2, 3, 4]   # 1・2年次
      max_credits_per_semester: 22
    - semesters: [5, 6]         # 3年次
      max_credits_per_semester: 24
    - semesters: [7, 8]         # 4年次
      max_credits_per_year: 48
      notes: "4年次は学期ごとの上限ではなく、通年（7・8セメスター合計）で48単位が上限"
  notes: |
    通年科目の単位数は第1学期（前期）と第2学期（後期）で2分割して計算する。
    クォーター型科目の単位数は1Q・2Qを前期に、3Q・4Qを後期に算入する。
    随意科目（教職課程・博物館学芸員課程など）、サマーセッション科目、「海外英語研修」、
    大学コンソーシアム京都の単位互換科目、放送大学科目は制限単位数に含まれない。
  gpa_exception: "前学期までの累積GPA3.5以上の学生は、申請により各学期2単位まで制限を拡大できる（毎学期初めの履修登録期間に先端理工学部教務課へ申請）"
# 特定科目群の卒業要件算入上限。超過分は overflow_to 先に計上し、null はどこにも計上しない(§5.1.5)
# 出典: 履修要項2023年度版「5. 設置科目（専門基礎科目・専門応用科目）」注意事項3)・4)
credit_caps:
  - titles:
      - "理工インターンシップ（学外実習）Ⅰ"
      - "理工インターンシップ（学外実習）Ⅱ"
    max_credits: 2
    overflow_to: null
  - titles:
      - "プロジェクトリサーチⅠ"
      - "プロジェクトリサーチⅡ"
    max_credits: 2
    overflow_to: null


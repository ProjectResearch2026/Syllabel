# 教養教育科目(先端理工学部【〜2025年度入学】版・全課程共通)
# 出典: https://cweb.ryukoku.ac.jp/~kyoga/rishu/pdf/01/2023/Y2023youkou20230324_3Elect.pdf
#   2023年度版 履修要項(冊子)p.36〜37「設置科目【2022年度以降入学生】」および
#   p.40「4. 卒業等の要件 (1)卒業要件単位(最低)数表」
# design.md §5.1.3。教養教育科目の要件枠(liberal.*)と設置科目一覧の唯一の定義元。
# 課程ファイルからのパス参照は持たず、同一ディレクトリにあることで対応づける(§4.4.2)。
#
# 履修要項Webサイトは2024年度以降しか公開しておらず(2023年度のURLは404、Internet Archive にも
# 取得がない)、2023年度版はPDF配布(https://cweb.ryukoku.ac.jp/~kyoga/rishu/rishu.html)のみが
# 原典となる。6課程分のPDFはいずれも同じ設置科目表を載せており、表の見出しは
# 【2022年度以降入学生】で2024・2025年度入学生と同一規定である。129科目すべてが
# 科目名・単位数・科目属性(必修/選択必修/選択)・配当セメスターの全項目で admission-2024 と
# 一致することを確認済み(相違0件)。記号の扱いも一致する(●33件・★4件・◆・■・※)。
#
# - シラバスコードは持たない。開講年度ファイル(offerings/<開講年度>/admission-2023/00-liberal-arts.yaml)が
#   科目名で結合する(§5.1.1)
# - kikan(基幹科目)は設置科目表の●印に対応する。2023年度版の設置科目表と照合し、●印33件
#   (人文22・社会11)が type:"選択必修" の外延と完全一致することを確認済み
# - quarters は持たない。教養教育科目はクォーター制の対象外である(§5.1.3・§5.1.5)。2023年度版の
#   設置科目表も列は「配当年次・セメスター」(1年次前/後・2年次前/後の4列)であり、
#   クォーターの格子を持たない
admission_year: 2023                # このファイルが属するコホート。ディレクトリ名と一致させる
liberal_arts_version: "until-2025"  # 履修要項の版(先端理工学部【〜2025年度入学】)
applies_to: ["先端理工学部"]
duplicate_of: "admission-2024/00-liberal-arts.yaml"   # 内容が同一のため複製(design §4.4.2・§12.2 でハッシュ一致を検査)

# 教養教育科目の卒業要件枠(合計28単位)。accepts の記法は §5.1.5
requirement_slots:
  - key: "liberal.buddhism"
    name: "教養教育科目(必修・仏教)"
    credits: 4
    accepts: {subcategory: "「仏教の思想」科目", type: "必修"}
  - key: "liberal.language.required"
    name: "教養教育科目(必修・言語)"
    credits: 6
    accepts: {subcategory: "必修外国語科目"}
    overflow_to: "liberal.elective"           # 履修要項 注記A
  - key: "liberal.general.humanities"
    name: "教養教育科目(選択必修〈基幹〉・人文)"
    credits: 2
    accepts: {subcategory: "人文科学系科目", kikan: true}
    overflow_to: "liberal.elective"
    notes: "基幹科目に指定された科目から1科目(2単位)以上"
  - key: "liberal.general.social"
    name: "教養教育科目(選択必修〈基幹〉・社会)"
    credits: 2
    accepts: {subcategory: "社会科学系科目", kikan: true}
    overflow_to: "liberal.elective"
    notes: "基幹科目に指定された科目から1科目(2単位)以上"
  - key: "liberal.general.sports"
    name: "教養教育科目(必修・スポーツ)"
    credits: 2
    accepts: {subcategory: "スポーツ科学系科目", type: "必修"}
  - key: "liberal.elective"
    name: "教養教育科目(選択)"
    credits: 12
    accepts: {category: "教養教育科目"}       # 上位枠に収まらない教養教育科目の受け皿
    overflow_to: "free.all"                   # 参照先は課程ファイル。解決はマージ後(§4.4.3)

# 卒業要件への算入上限。max_credits を超えた分は overflow_to 先に計上し、null はどこにも計上しない
prerequisites:
  # 先修制(選択外国語科目)。2024年度入学版は /curriculum/2024/faculty-rikou/s04 の
  # 「3. 言語科目 (3)選択外国語科目の履修 ③先修制」、2025年度入学版は /organization/no5/ の
  # 同じ節。表の内容は両年度で一致する(見出し語のみ「先修制授業科目等」/「授業科目等」と異なる)。
  # 原典は「ドイツ語セミナーⅠA、ⅠB」と2科目を1行にまとめているが、要件は各科目に個別に
  # かかるため1科目1エントリに展開した。
  - title: "ドイツ語セミナーⅠA"
    any_of: ["ドイツ語ⅠA", "ドイツ語ⅠB", "ドイツ語ⅡA", "ドイツ語ⅡB"]
    notes: "「ドイツ語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "ドイツ語セミナーⅠB"
    any_of: ["ドイツ語ⅠA", "ドイツ語ⅠB", "ドイツ語ⅡA", "ドイツ語ⅡB"]
    notes: "「ドイツ語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "フランス語セミナーⅠA"
    any_of: ["フランス語ⅠA", "フランス語ⅠB", "フランス語ⅡA", "フランス語ⅡB"]
    notes: "「フランス語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "フランス語セミナーⅠB"
    any_of: ["フランス語ⅠA", "フランス語ⅠB", "フランス語ⅡA", "フランス語ⅡB"]
    notes: "「フランス語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "中国語セミナーⅠA"
    any_of: ["中国語ⅠA", "中国語ⅠB", "中国語ⅡA", "中国語ⅡB"]
    notes: "「中国語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "中国語セミナーⅠB"
    any_of: ["中国語ⅠA", "中国語ⅠB", "中国語ⅡA", "中国語ⅡB"]
    notes: "「中国語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "コリア語セミナーⅠA"
    any_of: ["コリア語ⅠA", "コリア語ⅠB", "コリア語ⅡA", "コリア語ⅡB"]
    notes: "「コリア語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"
  - title: "コリア語セミナーⅠB"
    any_of: ["コリア語ⅠA", "コリア語ⅠB", "コリア語ⅡA", "コリア語ⅡB"]
    notes: "「コリア語ⅠA、ⅠB、ⅡA、ⅡB」の中からいずれかの1単位の修得"

credit_caps:
  - titles: ["教養教育科目特別講義"]
    max_credits: 2
    overflow_to: null
    notes: "設置科目表 注意事項「「教養教育科目特別講義」は複数の科目が開講されますが、卒業要件単位として認められるのは1科目2単位までです。（余剰分はフリーゾーンに計上されません。）」"
  - titles: ["生活の中の数学", "生活の中の化学", "生活の中の物理", "生活の中の生物学"]
    max_credits: 2
    overflow_to: null
    notes: "設置科目表 ★印「★印の4科目のうち、卒業要件単位として認められるのは1科目2単位までです。（余剰分はフリーゾーンにも計上されません。）」"

